<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Street Clash Mobile</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d17;font-family:Arial,sans-serif;touch-action:none}#g{position:fixed;inset:0;background:linear-gradient(#121a30 0 46%,#49233f 46% 61%,#151019 61%);overflow:hidden}.city{position:absolute;left:0;right:0;top:18%;height:29%}.b{position:absolute;bottom:0;background:#08101e}.b:after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,transparent 0 11px,#49d4ff 11px 14px,transparent 14px 25px),repeating-linear-gradient(0deg,transparent 0 15px,#d64dff 15px 18px,transparent 18px 31px);opacity:.35}.ring{position:absolute;left:5%;right:5%;top:53%;bottom:9%;background:linear-gradient(#70c3ff,#245e9b);border:8px solid #171925;box-shadow:0 22px 45px #0008}.ring:after{content:"STREET CLASH";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-7deg);font-size:clamp(28px,7vw,64px);font-weight:1000;color:#fff2;white-space:nowrap}.rope{position:absolute;left:4%;right:4%;height:5px;z-index:4;background:#ef3f5e}.r1{top:57%}.r2{top:63%;background:#eee}.r3{top:69%}.hud{position:absolute;left:2%;right:2%;top:2%;z-index:20;display:flex;gap:10px;align-items:center;color:#fff;font-weight:900;text-shadow:0 2px 3px #000}.side{flex:1}.right{text-align:right}.bar{height:19px;background:#161a24;border:2px solid #fff;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#1fe07f,#e3eb55,#ffd54a)}#bf{margin-left:auto;background:linear-gradient(90deg,#ffd54a,#ff8932,#ef3f4d)}#tm{width:58px;text-align:center;font-size:30px}.fighter{position:absolute;width:76px;height:152px;bottom:14%;left:28%;z-index:10;transform-origin:50% 100%}.fighter.bot{left:68%;transform:s t:0;z-index:50;pointer-events:none}.pad{position:absolute;left:10px;bottom:10px;width:158px;height:158px;border-radius:50%;background:#08101844;border:2px solid #ffffff2b;pointer-events:auto}.acts{position:absolute;right:8px;bottom:8px;width:220px;height:170px;pointer-events:auto}.c{position:absolute;border:0;border-radius:50%;color:#fff;font-weight:900;background:#181d2bd9;box-shadow:inset 0 0 0 2px #ffffff2b,0 4px 8px #0007;touch-action:none}.c:active,.on{filter:brightness(1.5);transform:scale(.94)}#L{left:2px;top:55px;width:50px;height:50px;font-size:22px}#R{right:2px;top:55px;width:50px;height:50px;font-size:22px}#J{left:54px;top:3px;width:50px;height:50px}#B{left:54px;bottom:3px;width:50px;height:50px;font-size:10px}#P{right:73px;top:48px;width:76px;height:76px;background:#187bc6}#K{right:2px;top:93px;width:62px;height:62px;background:#b87820}#S{right:3px;top:8px;width:62px;height:62px;background:#7137a9;font-size:11px}#D{left:2px;top:101px;width:58px;height:58px;background:#287158;font-size:11px}#msg{position:absolute;left:0;right:0;top:26%;z-index:30;text-align:center;color:#fff;font-size:clamp(38px,10vw,72px);font-weight:1000;text-shadow:0 4px #121525,0 0 18px #50d7ff;pointer-events:none;opacity:0}.debug{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:80;color:#ffffff99;font-size:10px}@media(max-height:430px){.pad{transform:scale(.8);transform-origin:left bottom}.acts{transform:scale(.8);transform-origin:right bottom}}</style></head><body><div id="g"><div class="hud"><div class="side"><div>PLAYER · RYUJI</div><div class="bar"><div id="pf" class="fill"></div></div></div><div id="tm">99</div><div class="side right"><div>BRAX · BOT</div><div class="bar"><div id="bf" class="fill"></div></div></div></div><div class="city"><div class="b" style="left:0;width:10%;height:60%"></div><div class="b" style="left:12%;width:9%;height:90%"></div><div class="b" style="left:23%;width:13%;height:68%"></div><div class="b" style="left:38%;width:10%;height:100%"></div><div class="b" style="left:50%;width:14%;height:75%"></div><div class="b" style="left:66%;width:10%;height:95%"></div><div class="b" style="left:78%;width:20%;height:70%"></div></div><div class="ring"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div id="p" class="fighter"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="belt"></div><div class="arm a1"></div><div class="arm a2"></div><div class="glove g1"></div><div class="glove g2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div id="bot" class="fighter bot"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="belt"></div><div class="arm a1"></div><div class="arm a2"></div><div class="glove g1"></div><div class="glove g2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div id="msg">FIGHT!</div><div id="controls"><div class="pad"><button class="c" id="L">◀</button><button class="c" id="R">▶</button><button class="c" id="J">▲</button><button class="c" id="B">BLOCK</button></div><div class="acts"><button class="c" id="P">PUNCH</button><button class="c" id="K">KICK</button><button class="c" id="S">SPECIAL</button><button class="c" id="D">DASH</button></div></div><div id="dbg" class="debug">TOUCH READY</div></div><script>(function(){"use strict";var pe=document.getElementById("p"),be=document.getElementById("bot"),pf=document.getElementById("pf"),bf=document.getElementById("bf"),tm=document.getElementById("tm"),msg=document.getElementById("msg"),g=document.getElementById("g"),dbg=document.getElementById("dbg");var P={x:28,hp:100,cool:0,atk:"",block:false,jump:false},B={x:68,hp:100,cool:0,atk:"",block:false},held={L:false,R:false},start=Date.now(),over=false,last=Date.now();function show(t){msg.textContent=t;msg.style.opacity=1;setTimeout(function(){msg.style.opacity=0},700)}show("FIGHT!");function draw(){pe.style.left=P.x+"%";be.style.left=B.x+"%";pf.style.width=P.hp+"%";bf.style.width=B.hp+"%";pe.classList.toggle("blocking",P.block);be.classList.toggle("blocking",B.block);if(P.x>B.x){pe.style.transform="scaleX(-1)";be.style.transform="scaleX(1)"}else{pe.style.transform="scaleX(1)";be.style.transform="scaleX(-1)"}}function dmg(a,d,de,n){var z=d.block?n*.25:n;d.hp=Math.max(0,d.hp-z);d.hit=true;de.classList.add("hit");setTimeout(function(){d.hit=false;de.classList.remove("hit")},160);if(d.hp<=0&&!over){over=true;show(a===P?"YOU WIN!":"BOT WINS!");setTimeout(reset,1600)}}function atk(a,d,el,type){if(over||a.cool>0||a.hit)return;a.atk=type;a.cool=type==="punch"?.34:type==="kick"?.48:.65;el.classList.add(type);setTimeout(function(){if(over)return;var dist=Math.abs(a.x-d.x),range=type==="punch"?13:type==="kick"?17:99;if(type==="special")shot(a===P);else if(dist<range)dmg(a,d,d===P?pe:be,type==="punch"?8:12)},type==="punch"?120:type==="kick"?170:180);setTimeout(function(){el.classList.remove(type)},420)}function shot(fromP){var a=fromP?P:B,d=fromP?B:P,s=document.createElement("div");s.className="shot"+(fromP?"":" botshot");s.style.left=a.x+"%";s.style.bottom="31%";g.appendChild(s);var x=a.x,dir=d.x>x?1:-1,iv=setInterval(function(){x+=dir*1.8;s.style.left=x+"%";if(Math.abs(x-d.x)<4){clearInterval(iv);s.remove();dmg(a,d,fromP?be:pe,18)}else if(x<-5||x>105){clearInterval(iv);s.remove()}},18)}function jump(){if(P.jump||over)return;P.jump=true;pe.classList.add("jump");setTimeout(function(){P.jump=false;pe.classList.remove("jump")},460)}function reset(){P.x=28;P.hp=100;P.cool=0;P.atk="";P.block=false;B.x=68;B.hp=100;B.cool=0;B.atk="";B.block=false;start=Date.now();over=false;show("FIGHT!")}function botAI(){if(over)return;var dist=Math.abs(P.x-B.x);B.block=false;if(dist>16){B.x+=P.x>B.x?1:-1}else{var r=Math.random();if(P.atk&&r<.25)B.block=true;else if(r<.48)atk(B,P,be,"punch");else if(r<.80)atk(B,P,be,"kick");else if(r<.88)atk(B,P,be,"special")}}setInterval(botAI,170);function loop(){var now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(P.cool>0){P.cool-=dt;if(P.cool<=0)P.atk=""}if(B.cool>0){B.cool-=dt;if(B.cool<=0)B.atk=""}if(!over&&!P.atk&&!P.block){if(held.L)P.x-=24*dt;if(held.R)P.x+=24*dt;P.x=Math.max(7,Math.min(86,P.x))}if(!over){var t=Math.max(0,99-Math.floor((now-start)/1000));tm.textContent=t;if(t===0){over=true;show(P.hp===B.hp?"DRAW!":P.hp>B.hp?"YOU WIN!":"BOT WINS!");setTimeout(reset,1600)}}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function hold(id,key){var e=document.getElementById(id);function on(ev){ev.preventDefault();held[key]=true;e.classList.add("on");dbg.textContent=id+" ON"}function off(ev){ev.preventDefault();held[key]=false;e.classList.remove("on")}e.addEventListener("pointerdown",on);e.addEventListener("pointerup",off);e.addEventListener("pointercancel",off);e.addEventListener("touchstart",on,{passive:false});e.addEventListener("touchend",off,{passive:false});e.addEventListener("touchcancel",off,{passive:false})}hold("L","L");hold("R","R");(function(){var e=document.getElementById("B");function on(ev){ev.preventDefault();P.block=true;e.classList.add("on")}function off(ev){ev.preventDefault();P.block=false;e.classList.remove("on")}e.addEventListener("pointerdown",on);e.addEventListener("pointerup",off);e.addEventListener("touchstart",on,{passive:false});e.addEventListener("touchend",off,{passive:false})})();function tap(id,fn){var e=document.getElementById(id),lock=false;function fire(ev){ev.preventDefault();if(lock)return;lock=true;setTimeout(function(){lock=false},80);fn();dbg.textContent=id}e.addEventListener("pointerdown",fire);e.addEventListener("touchstart",fire,{passive:false})}tap("J",jump);tap("P",function(){atk(P,B,pe,"punch")});tap("K",function(){atk(P,B,pe,"kick")});tap("S",function(){atk(P,B,pe,"special")});tap("D",function(){if(!over){P.x+=B.x>P.x?7:-7;P.x=Math.max(7,Math.min(86,P.x))}});window.addEventListener("error",function(e){dbg.textContent="ERR: "+e.message;dbg.style.color="#ff8080"});draw()})();</script></body></html>
