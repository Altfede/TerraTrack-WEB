width:72px;height:14px;border-radius:50%;background:#0006}.torso{position:absolute;left:35px;top:73px;width:52px;height:66px;border-radius:16px;background:#eee;border:5px solid #13161d}.bot .torso{left:29px;width:64px;background:#25262d}.head{position:absolute;left:40px;top:22px;width:42px;height:48px;border-radius:48%;background:#dfa380;border:5px solid #13161d}.bot .head{left:35px;width:50px;height:54px;background:#b97a61}.hair{position:absolute;left:31px;top:6px;width:60px;height:35px;background:#251713;clip-path:polygon(0 100%,8% 35%,20% 75%,34% 0,48% 72%,63% 8%,76% 73%,90% 25%,100% 100%)}.bot .hair{left:52px;top:0;width:18px;height:44px;background:#e7dfd3;clip-path:polygon(0 100%,0 20%,30% 0,50% 35%,70% 0,100% 20%,100% 100%)}.eye{position:absolute;left:65px;top:43px;width:10px;height:4px;background:#111;border-radius:3px}.bot .eye{left:67px;top:40px}.band{position:absolute;left:34px;top:40px;width:40px;height:6px;background:#d83b40}.bot .band{display:none}.arm,.leg{position:absolute;border:5px solid #13161d;border-radius:18px;transform-origin:50% 10px}.arm{width:22px;height:70px;top:81px;background:#dfa380}.bot .arm{width:25px;height:76px;background:#b97a61}.a1{left:17px;transform:rotate(18deg)}.a2{right:17px;transform:rotate(-18deg)}.leg{width:24px;height:82px;top:132px;background:#242630}.l1{left:37px;transform:rotate(4deg)}.l2{right:37px;transform:rotate(-4deg)}.bot .leg{background:#252525}.glove{position:absolute;top:139px;width:25px;height:25px;border-radius:50%;background:#c62f34;border:5px solid #111}.g1{left:13px}.g2{right:13px}.bot .glove{background:#181818}.shoe{position:absolute;top:199px;width:33px;height:16px;background:#eef1f5;border-top:4px solid #d83b40;border-radius:4px}.sh1{left:22px}.sh2{right:22px}.bot .shoe{background:#111;border-top-color:#d0a03f}.fighter.faceLeft{transform:scaleX(-1)}.fighter.punch .a2{right:4px;top:70px;height:84px;transform:rotate(-92deg)}.fighter.kick .l2{right:10px;top:122px;height:95px;transform:rotate(-82deg)}.fighter.block .a1{left:38px;top:75px;transform:rotate(-60deg)}.fighter.block .a2{right:38px;top:75px;transform:rotate(60deg)}.fighter.jump{animation:j .46s ease-out}@keyframes j{45%{margin-bottom:110px}}.fighter.hit{filter:brightness(1.8);animation:h .15s}@keyframes h{50%{margin-left:9px}}.shot{position:absolute;width:34px;height:34px;border-radius:50%;z-index:15;background:radial-gradient(circle,#fff 0 18%,#4bd6ff 25% 48%,transparent 72%)}.shot.enemy{background:radial-gradient(circle,#fff 0 18%,#ffb44b 25% 48%,transparent 72%)}#msg{position:absolute;left:0;right:0;top:26%;text-align:center;color:#fff;font:900 9vw Arial;text-shadow:0 4px #101420,0 0 16px #4bdcff;z-index:30;opacity:0}#ctrl{position:absolute;inset:0;z-index:40;pointer-events:none}.pad{position:absolute;left:10px;bottom:10px;width:158px;height:158px;border-radius:50%;background:#0003;border:2px solid #fff2;pointer-events:auto}.acts{position:absolute;right:8px;bottom:8px;width:220px;height:170px;pointer-events:auto}.btn{position:absolute;border:0;border-radius:50%;color:#fff;font-weight:900;background:#20283bdd;box-shadow:inset 0 0 0 2px #fff2;touch-action:none}.btn.on,.btn:active{filter:brightness(1.6);transform:scale(.94)}#L{left:2px;top:54px;width:50px;height:50px}#R{right:2px;top:54px;width:50px;height:50px}#J{left:53px;top:2px;width:50px;height:50px}#BL{left:53px;bottom:2px;width:50px;height:50px;font-size:10px}#P{right:74px;top:47px;width:76px;height:76px;background:#167cc9}#K{right:2px;top:92px;width:62px;height:62px;background:#b87820}#S{right:3px;top:8px;width:62px;height:62px;background:#7137aa;font-size:11px}#D{left:2px;top:101px;width:58px;height:58px;background:#27715a;font-size:11px}#dbg{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);color:#fff8;font-size:10px;z-index:50}@media(max-height:430px){.pad{transform:scale(.8);transform-origin:left bottom}.acts{transform:scale(.8);transform-origin:right bottom}}</style></head><body><div id="g"><div class="hud"><div class="s">PLAYER · RYUJI<div class="bar"><div id="ph" class="hp"></div></div></div><div id="tm">99</div><div class="s r">BRAX · BOT<div class="bar"><div id="bh" class="hp"></div></div></div></div><div class="city"><div class="b" style="left:0;width:10%;height:60%"></div><div class="b" style="left:12%;width:9%;height:88%"></div><div class="b" style="left:23%;width:12%;height:68%"></div><div class="b" style="left:37%;width:10%;height:100%"></div><div class="b" style="left:49%;width:14%;height:75%"></div><div class="b" style="left:66%;width:10%;height:95%"></div><div class="b" style="left:79%;width:19%;height:72%"></div></div><div class="ring"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div id="p" class="fighter"><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="band"></div><div class="eye"></div><div class="torso"></div><div class="arm a1"></div><div class="arm a2"></div><div class="glove g1"></div><div class="glove g2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe sh1"></div><div class="shoe sh2"></div></div><div id="b" class="fighter bot"><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="band"></div><div class="eye"></div><div class="torso"></div><div class="arm a1"></div><div class="arm a2"></div><div class="glove g1"></div><div class="glove g2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe sh1"></div><div class="shoe sh2"></div></div><div id="msg">FIGHT!</div><div id="ctrl"><div class="pad"><button class="btn" id="L">◀</button><button class="btn" id="R">▶</button><button class="btn" id="J">▲</button><button class="btn" id="BL">BLOCK</button></div><div class="acts"><button class="btn" id="P">PUNCH</button><button class="btn" id="K">KICK</button><button class="btn" id="S">SPECIAL</button><button class="btn" id="D">DASH</button></div></div><div id="dbg">TOUCH READY</div></div><script>(function(){'use strict';var pe=document.getElementById('p'),be=document.getElementById('b'),ph=document.getElementById('ph'),bh=document.getElementById('bh'),tm=document.getElementById('tm'),msg=document.getElementById('msg'),g=document.getElementById('g'),dbg=document.getElementById('dbg');var P={x:22,hp:100,cool:0,atk:'',block:false,jump:false,hit:false},B={x:66,hp:100,cool:0,atk:'',block:false,hit:false},held={L:false,R:false};var start=Date.now(),last=Date.now(),over=false;function show(s){msg.textContent=s;msg.style.opacity='1';setTimeout(function(){msg.style.opacity='0'},700)}function draw(){pe.style.left=P.x+'%';be.style.left=B.x+'%';ph.style.width=P.hp+'%';bh.style.width=B.hp+'%';pe.classList.toggle('block',P.block);be.classList.toggle('block',B.block);if(P.x>B.x){pe.classList.add('faceLeft');be.classList.remove('faceLeft')}else{pe.classList.remove('faceLeft');be.classList.add('faceLeft')}}function damage(a,d,el,n){if(d.block)n*=.25;d.hp=Math.max(0,d.hp-n);d.hit=true;el.classList.add('hit');setTimeout(function(){d.hit=false;el.classList.remove('hit')},150);if(d.hp<=0&&!over){over=true;show(a===P?'YOU WIN!':'BOT WINS!');setTimeout(reset,1600)}}function projectile(fromP){var a=fromP?P:B,d=fromP?B:P,s=document.createElement('div');s.className='shot'+(fromP?'':' enemy');s.style.left=a.x+'%';s.style.bottom='30%';g.appendChild(s);var x=a.x,dir=d.x>x?1:-1,iv=setInterval(function(){x+=dir*1.8;s.style.left=x+'%';if(Math.abs(x-d.x)<4){clearInterval(iv);s.remove();damage(a,d,fromP?be:pe,18)}else if(x<-5||x>105){clearInterval(iv);s.remove()}},18)}function attack(a,d,el,type){if(over||a.cool>0||a.hit)return;a.atk=type;if(type==='punch')a.cool=.34;else if(type==='kick')a.cool=.48;else a.cool=.65;el.classList.add(type);var wait=180;if(type==='punch')wait=120;else if(type==='kick')wait=170;setTimeout(function(){if(over)return;if(type==='special'){projectile(a===P);return}var range=type==='punch'?13:17;if(Math.abs(a.x-d.x)<range)damage(a,d,d===P?pe:be,type==='punch'?8:12)},wait);setTimeout(function(){el.classList.remove(type)},420)}function jump(){if(P.jump||over)return;P.jump=true;pe.classList.add('jump');setTimeout(function(){P.jump=false;pe.classList.remove('jump')},460)}function reset(){P.x=22;P.hp=100;P.cool=0;P.atk='';P.block=false;P.hit=false;B.x=66;B.hp=100;B.cool=0;B.atk='';B.block=false;B.hit=false;start=Date.now();over=false;show('FIGHT!')}function ai(){if(over)return;var d=Math.abs(P.x-B.x);B.block=false;if(d>16){if(P.x>B.x)B.x+=1;else B.x-=1}else{var r=Math.random();if(P.atk&&r<.25)B.block=true;else if(r<.50)attack(B,P,be,'punch');else if(r<.82)attack(B,P,be,'kick');else if(r<.90)attack(B,P,be,'special')}}setInterval(ai,170);function loop(){var now=Date.now(),dt=(now-last)/1000;if(dt>.05)dt=.05;last=now;if(P.cool>0){P.cool-=dt;if(P.cool<=0)P.atk=''}if(B.cool>0){B.cool-=dt;if(B.cool<=0)B.atk=''}if(!over&&!P.atk&&!P.block){if(held.L)P.x-=25*dt;if(held.R)P.x+=25*dt;P.x=Math.max(7,Math.min(86,P.x))}if(!over){var sec=99-Math.floor((now-start)/1000);if(sec<0)sec=0;tm.textContent=sec;if(sec===0){over=true;show(P.hp===B.hp?'DRAW!':(P.hp>B.hp?'YOU WIN!':'BOT WINS!'));setTimeout(reset,1600)}}draw();requestAnimationFrame(loop)}function bindHold(id,key){var e=document.getElementById(id);function on(ev){ev.preventDefault();held[key]=true;e.classList.add('on');dbg.textContent=id+' ON'}function off(ev){ev.preventDefault();held[key]=false;e.classList.remove('on')}e.addEventListener('touchstart',on,{passive:false});e.addEventListener('touchend',off,{passive:false});e.addEventListener('touchcancel',off,{passive:false});e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off)}function tap(id,fn){var e=document.getElementById(id),lock=false;function fire(ev){ev.preventDefault();if(lock)return;lock=true;setTimeout(function(){lock=false},90);fn();dbg.textContent=id}e.addEventListener('touchstart',fire,{passive:false});e.addEventListener('pointerdown',fire)}bindHold('L','L');bindHold('R','R');var bl=document.getElementById('BL');function bon(ev){ev.preventDefault();P.block=true;bl.classList.add('on')}function boff(ev){ev.preventDefault();P.block=false;bl.classList.remove('on')}bl.addEventListener('touchstart',bon,{passive:false});bl.addEventListener('touchend',boff,{passive:false});bl.addEventListener('pointerdown',bon);bl.addEventListener('pointerup',boff);tap('J',jump);tap('P',function(){attack(P,B,pe,'punch')});tap('K',function(){attack(P,B,pe,'kick')});tap('S',function(){attack(P,B,pe,'special')});tap('D',function(){if(!over){P.x+=B.x>P.x?7:-7;P.x=Math.max(7,Math.min(86,P.x))}});window.addEventListener('error',function(e){dbg.textContent='ERR: '+e.message;dbg.style.color='#ff8080'});show('FIGHT!');draw();requestAnimationFrame(loop)})();</script></body></html>
