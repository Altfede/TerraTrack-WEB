<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Street Clash</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101522;font-family:Arial;touch-action:none}#g{position:fixed;inset:0;background:linear-gradient(#182340 0 48%,#5a2b4c 48% 61%,#16101a 61%);overflow:hidden}.ring{position:absolute;left:5%;right:5%;top:54%;bottom:8%;background:linear-gradient(#69baff,#275d98);border:7px solid #171925;box-shadow:0 18px 40px #0008}.ring:after{content:'STREET CLASH';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-7deg);font:bold 8vw Arial;color:#fff2;white-space:nowrap}.rope{position:absolute;left:4%;right:4%;height:5px;background:#f04460;z-index:2}.r1{top:58%}.r2{top:64%;background:#eee}.r3{top:70%}.hud{position:absolute;left:2%;right:2%;top:2%;display:flex;gap:10px;color:#fff;font:bold 12px Arial;z-index:10}.side{flex:1}.side:last-child{text-align:right}.bar{height:18px;border:2px solid #fff;background:#111827}.hp{height:100%;width:100%;background:linear-gradient(90deg,#2ee186,#e6ef59,#ffd54b)}#bhp{margin-left:auto;background:linear-gradient(90deg,#ffd54b,#ff8833,#ef4050)}#t{width:50px;text-align:center;font-size:28px}.f{position:absolute;bottom:14%;width:72px;height:148px;z-index:5;transform-origin:50% 100%}.p{left:28%}.b{left:68%;transform:scaleX(-1)}.head{position:absolute;left:20px;top:12px;width:34px;height:34px;border-radius:50%;background:#dea17d;border:4px solid #12151c}.b .head{background:#b97a61}.body{position:absolute;left:18px;top:46px;width:40px;height:58px;border-radius:12px;background:#eee;border:5px solid #12151c}.b .body{left:14px;width:48px;background:#25262c}.arm,.leg{position:absolute;border:4px solid #12151c;border-radius:14px;transform-origin:50% 8px}.arm{top:55px;width:18px;height:52px;background:#dea17d}.b .arm{background:#b97a61}.a1{left:5px;transform:rotate(18deg)}.a2{right:5px;transform:rotate(-18deg)}.leg{top:98px;width:20px;height:55px;background:#242630}.l1{left:18px}.l2{right:16px}.punch .a2{transform:rotate(-90deg) translateY(40px);height:72px}.kick .l2{transform:rotate(-82deg) translateY(40px);height:78px}.block .a1{left:24px;top:45px;transform:rotate(-52deg)}.block .a2{right:24px;top:45px;transform:rotate(55deg)}.jump{animation:j .45s ease-out}@keyframes j{45%{margin-bottom:105px}}.hit{filter:brightness(2);animation:h .15s}@keyframes h{50%{margin-left:10px}}#msg{position:absolute;left:0;right:0;top:26%;text-align:center;color:#fff;font:bold 10vw Arial;text-shadow:0 4px #101420,0 0 16px #4bdcff;z-index:11;opacity:0}.shot{position:absolute;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#4bdcff 25% 50%,transparent 72%);z-index:8}.enemyshot{background:radial-gradient(circle,#fff 0 20%,#ffb64b 25% 50%,transparent 72%)}#c{position:absolute;inset:0;z-index:20;pointer-events:none}.pad{position:absolute;left:10px;bottom:10px;width:156px;height:156px;border-radius:50%;background:#0003;border:2px solid #fff2;pointer-events:auto}.acts{position:absolute;right:8px;bottom:8px;width:220px;height:170px;pointer-events:auto}.btn{position:absolute;border:0;border-radius:50%;color:#fff;font-weight:bold;background:#20283bdd;box-shadow:inset 0 0 0 2px #fff2;touch-action:none}.btn:active{filter:brightness(1.6)}#L{left:2px;top:54px;width:50px;height:50px}#R{right:2px;top:54px;width:50px;height:50px}#J{left:53px;top:2px;width:50px;height:50px}#BL{left:53px;bottom:2px;width:50px;height:50px;font-size:10px}#P{right:74px;top:47px;width:76px;height:76px;background:#167cc9}#K{right:2px;top:92px;width:62px;height:62px;background:#b87820}#S{right:3px;top:8px;width:62px;height:62px;background:#7137aa;font-size:11px}#D{left:2px;top:101px;width:58px;height:58px;background:#27715a;font-size:11px}#dbg{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);color:#fff8;font-size:10px;z-index:30}@media(max-height:430px){.pad{transform:scale(.8);transform-origin:left bottom}.acts{transform:scale(.8);transform-origin:right bottom}}</style></head><body><div id="g"><div class="hud"><div class="side">PLAYER<div class="bar"><div id="php" class="hp"></div></div></div><div id="t">99</div><div class="side">BOT<div class="bar"><div id="bhp" class="hp"></div></div></div></div><div class="ring"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div id="p" class="f p"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div id="b" class="f b"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div id="msg">FIGHT!</div><div id="c"><div class="pad"><button class="btn" id="L">◀</button><button class="btn" id="R">▶</button><button class="btn" id="J">▲</button><button class="btn" id="BL">BLOCK</button></div><div class="acts"><button class="btn" id="P">PUNCH</button><button class="btn" id="K">KICK</button><button class="btn" id="S">SPECIAL</button><button class="btn" id="D">DASH</button></div></div><div id="dbg">TOUCH READY</div></div><script>(function(){var pe=document.getElementById('p'),be=document.getElementById('b'),php=document.getElementById('php'),bhp=document.getElementById('bhp'),tm=document.getElementById('t'),msg=document.getElementById('msg'),g=document.getElementById('g'),dbg=document.getElementById('dbg');var P={x:28,hp:100,cool:0,atk:'',block:false,jump:false,hit:false},B={x:68,hp:100,cool:0,atk:'',block:false,hit:false};var held={L:false,R:false};var start=Date.now(),last=Date.now(),over=false;function show(s){msg.textContent=s;msg.style.opacity=1;setTimeout(function(){msg.style.opacity=0},700)}function draw(){pe.style.left=P.x+'%';be.style.left=B.x+'%';php.style.width=P.hp+'%';bhp.style.width=B.hp+'%';pe.classList.toggle('block',P.block);be.classList.toggle('block',B.block);if(P.x>B.x){pe.style.transform='scaleX(-1)';be.style.transform='scaleX(1)'}else{pe.style.transform='scaleX(1)';be.style.transform='scaleX(-1)'}}function damage(a,d,el,n){if(d.block)n=n*.25;d.hp=Math.max(0,d.hp-n);d.hit=true;el.classList.add('hit');setTimeout(function(){d.hit=false;el.classList.remove('hit')},150);if(d.hp<=0&&!over){over=true;show(a===P?'YOU WIN!':'BOT WINS!');setTimeout(reset,1600)}}function attack(a,d,el,type){if(over||a.cool>0||a.hit)return;a.atk=type;if(type==='punch')a.cool=.34;else if(type==='kick')a.cool=.48;else a.cool=.65;el.classList.add(type);var wait=180;if(type==='punch')wait=120;else if(type==='kick')wait=170;setTimeout(function(){if(over)return;if(type==='special'){projectile(a===P);return}var range=type==='punch'?13:17;if(Math.abs(a.x-d.x)<range)damage(a,d,d===P?pe:be,type==='punch'?8:12)},wait);setTimeout(function(){el.classList.remove(type)},420)}function projectile(fromP){var a=fromP?P:B,d=fromP?B:P,s=document.createElement('div');s.className='shot'+(fromP?'':' enemyshot');s.style.left=a.x+'%';s.style.bottom='31%';g.appendChild(s);var x=a.x,dir=d.x>x?1:-1;var iv=setInterval(function(){x+=dir*1.8;s.style.left=x+'%';if(Math.abs(x-d.x)<4){clearInterval(iv);s.remove();damage(a,d,fromP?be:pe,18)}else if(x<-5||x>105){clearInterval(iv);s.remove()}},18)}function jump(){if(P.jump||over)return;P.jump=true;pe.classList.add('jump');setTimeout(function(){P.jump=false;pe.classList.remove('jump')},460)}function reset(){P.x=28;P.hp=100;P.cool=0;P.atk='';P.block=false;P.hit=false;B.x=68;B.hp=100;B.cool=0;B.atk='';B.block=false;B.hit=false;start=Date.now();over=false;show('FIGHT!')}function ai(){if(over)return;var d=Math.abs(P.x-B.x);B.block=false;if(d>16){if(P.x>B.x)B.x+=1;else B.x-=1}else{var r=Math.random();if(P.atk&&r<.25)B.block=true;else if(r<.5)attack(B,P,be,'punch');else if(r<.82)attack(B,P,be,'kick');else if(r<.9)attack(B,P,be,'special')}}setInterval(ai,170);function loop(){var now=Date.now(),dt=(now-last)/1000;if(dt>.05)dt=.05;last=now;if(P.cool>0){P.cool-=dt;if(P.cool<=0)P.atk=''}if(B.cool>0){B.cool-=dt;if(B.cool<=0)B.atk=''}if(!over&&!P.atk&&!P.block){if(held.L)P.x-=25*dt;if(held.R)P.x+=25*dt;P.x=Math.max(7,Math.min(86,P.x))}if(!over){var sec=99-Math.floor((now-start)/1000);if(sec<0)sec=0;tm.textContent=sec;if(sec===0){over=true;show(P.hp===B.hp?'DRAW!':(P.hp>B.hp?'YOU WIN!':'BOT WINS!'));setTimeout(reset,1600)}}draw();requestAnimationFrame(loop)}function hold(id,key){var e=document.getElementById(id);function on(ev){ev.preventDefault();held[key]=true;dbg.textContent=id+' ON'}function off(ev){ev.preventDefault();held[key]=false}e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('touchstart',on,{passive:false});e.addEventListener('touchend',off,{passive:false});e.addEventListener('touchcancel',off,{passive:false})}function tap(id,fn){var e=document.getElementById(id),lock=false;function fire(ev){ev.preventDefault();if(lock)return;lock=true;setTimeout(function(){lock=false},80);fn();dbg.textContent=id}e.addEventListener('pointerdown',fire);e.addEventListener('touchstart',fire,{passive:false})}hold('L','L');hold('R','R');var bl=document.getElementById('BL');function bon(ev){ev.preventDefault();P.block=true}function boff(ev){ev.preventDefault();P.block=false}bl.addEventListener('pointerdown',bon);bl.addEventListener('pointerup',boff);bl.addEventListener('touchstart',bon,{passive:false});bl.addEventListener('touchend',boff,{passive:false});tap('J',jump);tap('P',function(){attack(P,B,pe,'punch')});tap('K',function(){attack(P,B,pe,'kick')});tap('S',function(){attack(P,B,pe,'special')});tap('D',function(){if(!over){P.x+=B.x>P.x?7:-7;P.x=Math.max(7,Math.min(86,P.x))}});window.addEventListener('error',function(e){dbg.textContent='ERR: '+e.message;dbg.style.color='#ff8080'});show('FIGHT!');draw();requestAnimationFrame(loop)})();</script></body></html>
