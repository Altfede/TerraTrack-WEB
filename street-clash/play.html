<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Street Clash Characters</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d16;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#game{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 50% 18%,rgba(125,65,255,.30),transparent 30%),
    linear-gradient(#11182f 0 42%, #452246 42% 59%, #17111d 59% 100%);
}
.city{position:absolute;left:0;right:0;top:18%;height:30%}
.bld{position:absolute;bottom:0;background:#09111f;border-top:2px solid rgba(78,208,255,.25)}
.bld:before{content:"";position:absolute;inset:8px;opacity:.38;background:repeating-linear-gradient(90deg,transparent 0 12px,#49d4ff 12px 15px,transparent 15px 27px),repeating-linear-gradient(0deg,transparent 0 15px,#d64dff 15px 18px,transparent 18px 31px)}
#crowd{position:absolute;left:0;right:0;top:42%;height:17%;overflow:hidden}
.person{position:absolute;bottom:0;width:16px;height:34px;background:#090a11;border-radius:8px 8px 2px 2px}
.person:before{content:"";position:absolute;left:1px;top:-10px;width:14px;height:14px;border-radius:50%;background:#090a11}
#ring{position:absolute;left:5%;right:5%;top:53%;bottom:9%;background:linear-gradient(#74c7ff,#245d9b);border:8px solid #171925;box-shadow:0 22px 45px rgba(0,0,0,.55)}
#ring:after{content:"STREET CLASH";position:absolute;left:50%;top:51%;transform:translate(-50%,-50%) rotate(-7deg);font-size:clamp(28px,7vw,64px);font-weight:1000;color:rgba(255,255,255,.12);white-space:nowrap}
.rope{position:absolute;left:5%;right:5%;height:5px;z-index:4;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.r1{top:57%;background:#ef3f5e}.r2{top:63%;background:#f1f3f5}.r3{top:69%;background:#ef3f5e}
.post{position:absolute;top:51%;bottom:7%;width:12px;background:linear-gradient(90deg,#81848e,#f0f3f9,#777b87);z-index:4}.pl{left:4.3%}.pr{right:4.3%}
#hud{position:absolute;left:2%;right:2%;top:2%;z-index:30;display:flex;gap:10px;align-items:center;color:#fff;font-weight:900;text-shadow:0 2px 3px #000}.side{flex:1}.right{text-align:right}.label{font-size:clamp(10px,2.4vw,16px);margin-bottom:4px}.bar{height:19px;background:#171b25;border:2px solid #fff;overflow:hidden;transform:skewX(-8deg)}.fill{height:100%;width:100%;background:linear-gradient(90deg,#23df83,#ddeb58,#ffd54a)}#bf{margin-left:auto;background:linear-gradient(90deg,#ffd54a,#ff8b31,#ef3f4d)}.energy{height:7px;margin-top:4px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);overflow:hidden}.energyfill{height:100%;width:0;background:linear-gradient(90deg,#4ad8ff,#8c5bff)}#timer{width:58px;text-align:center;font-size:30px}#msg{position:absolute;left:0;right:0;top:25%;z-index:40;text-align:center;color:#fff;font-size:clamp(38px,9vw,72px);font-weight:1000;text-shadow:0 4px 0 #121525,0 0 18px #50d7ff;pointer-events:none;opacity:0;transition:opacity .18s}
.fighter{position:absolute;width:130px;height:230px;bottom:10%;left:22%;z-index:12;transform-origin:50% 100%}.fighter.bot{left:66%;transform:scaleX(-1)}.shadow{position:absolute;left:28px;bottom:-3px;width:76px;height:16px;border-radius:50%;background:rgba(0,0,0,.36);filter:blur(1px)}.torso{position:absolute;left:37px;top:78px;width:54px;height:66px;border-radius:16px;background:#eceef1;border:5px solid #141821}.bot .torso{left:31px;width:64px;height:72px;background:#24262d}.chestStripe{position:absolute;left:37px;top:124px;width:54px;height:10px;background:#d9383d}.bot .chestStripe{left:31px;width:64px;background:#d0a03f}.neck{position:absolute;left:57px;top:63px;width:14px;height:20px;background:#dea280;border-left:4px solid #141821;border-right:4px solid #141821}.bot .neck{left:56px;width:16px;background:#b9785e}.head{position:absolute;left:43px;top:24px;width:42px;height:46px;border-radius:48% 48% 46% 46%;background:#dea280;border:5px solid #141821}.bot .head{left:39px;top:19px;width:50px;height:54px;background:#b9785e}.eye{position:absolute;left:68px;top:44px;width:10px;height:4px;background:#111;border-radius:3px}.bot .eye{left:70px;top:40px}.hair{position:absolute;left:35px;top:9px;width:58px;height:34px;background:#241712;clip-path:polygon(0 100%,8% 35%,20% 75%,35% 0,48% 72%,61% 8%,76% 73%,90% 25%,100% 100%)}.bot .hair{left:57px;top:0;width:18px;height:44px;background:#ece2d5;clip-path:polygon(0 100%,0 30%,20% 0,40% 28%,60% 0,80% 30%,100% 0,100% 100%)}.headband{position:absolute;left:36px;top:42px;width:40px;height:6px;background:#d9383d;transform:rotate(-4deg)}.bot .headband{display:none}.beard{position:absolute;left:50px;top:47px;width:24px;height:17px;background:#1f1715;border-radius:0 0 18px 18px / 0 0 14px 14px;display:none}.bot .beard{display:block}.arm{position:absolute;width:22px;height:72px;background:#dea280;border:5px solid #141821;border-radius:18px;transform-origin:50% 10px}.bot .arm{background:#b9785e;width:25px;height:78px}.a1{left:18px;top:84px;transform:rotate(18deg)}.a2{right:18px;top:84px;transform:rotate(-18deg)}.glove{position:absolute;width:24px;height:24px;border-radius:50%;background:#c52f34;border:5px solid #111;top:142px}.g1{left:14px}.g2{right:14px}.bot .glove{background:#181818}.leg{position:absolute;width:24px;height:84px;background:#23262e;border:5px solid #141821;border-radius:18px;top:136px;transform-origin:50% 12px}.l1{left:39px;transform:rotate(4deg)}.l2{right:39px;transform:rotate(-4deg)}.bot .leg{background:#252525}.shoe{position:absolute;width:34px;height:16px;border-radius:4px;background:#eef1f5;top:207px;border-top:4px solid #d9383d}.s1{left:24px}.s2{right:24px}.bot .shoe{background:#111;border-top-color:#d0a03f}
.fighter.faceLeft{transform:scaleX(-1)}.fighter.hit{filter:brightness(1.65);animation:hitFlash .14s linear}@keyframes hitFlash{35%{margin-left:8px}70%{margin-left:-6px}}.fighter.jump{animation:jumpAnim .46s ease-out}@keyframes jumpAnim{45%{margin-bottom:110px}}.fighter.blocking .a1{left:40px;top:78px;transform:rotate(-60deg)}.fighter.blocking .a2{right:40px;top:78px;transform:rotate(60deg)}.fighter.punch .a2{right:6px;top:72px;height:82px;transform:rotate(-92deg)}.fighter.kick .l2{right:12px;top:126px;height:96px;transform:rotate(-82deg)}.fighter.special{filter:drop-shadow(0 0 12px #52d7ff) brightness(1.14)}.fighter.bot.special{filter:drop-shadow(0 0 12px #ffb54b) brightness(1.14)}.shot{position:absolute;width:34px;height:34px;border-radius:50%;z-index:18;background:radial-gradient(circle,#fff 0 18%,#52d7ff 25% 48%,rgba(82,215,255,0) 70%)}.shot.botshot{background:radial-gradient(circle,#fff 0 18%,#ffb44b 25% 48%,rgba(255,180,75,0) 70%)}
#controls{position:absolute;inset:0;z-index:50;pointer-events:none}.pad{position:absolute;left:10px;bottom:max(10px,env(safe-area-inset-bottom));width:158px;height:158px;border-radius:50%;background:rgba(8,12,19,.24);border:2px solid rgba(255,255,255,.18);pointer-events:auto}.acts{position:absolute;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:220px;height:170px;pointer-events:auto}.c{position:absolute;border:0;border-radius:50%;color:#fff;font-weight:900;background:rgba(21,25,36,.84);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 4px 8px rgba(0,0,0,.35);touch-action:none}.c:active,.on{filter:brightness(1.45);transform:scale(.94)}#L{left:2px;top:55px;width:50px;height:50px;font-size:22px}#R{right:2px;top:55px;width:50px;height:50px;font-size:22px}#J{left:54px;top:3px;width:50px;height:50px}#BL{left:54px;bottom:3px;width:50px;height:50px;font-size:10px}#P{right:73px;top:48px;width:76px;height:76px;background:#187bc6}#K{right:2px;top:93px;width:62px;height:62px;background:#b87820}#S{right:3px;top:8px;width:62px;height:62px;background:#7137a9;font-size:11px}#D{left:2px;top:101px;width:58px;height:58px;background:#287158;font-size:11px}#dbg{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:70;color:rgba(255,255,255,.55);font-size:10px}@media(max-height:430px){.pad{transform:scale(.8);transform-origin:left bottom}.acts{transform:scale(.8);transform-origin:right bottom}.fighter{transform:scale(.88);transform-origin:50% 100%}.fighter.bot{transform:scale(.88) scaleX(-1)}}
</style>
</head>
<body>
<div id="game">
  <div id="hud"><div class="side"><div class="label">PLAYER · RYUJI</div><div class="bar"><div id="pf" class="fill"></div></div><div class="energy"><div id="pe" class="energyfill"></div></div></div><div id="timer">99</div><div class="side right"><div class="label">BRAX · BOT</div><div class="bar"><div id="bf" class="fill"></div></div><div class="energy"><div id="be" class="energyfill"></div></div></div></div>
  <div class="city"><div class="bld" style="left:0;width:10%;height:60%"></div><div class="bld" style="left:12%;width:9%;height:88%"></div><div class="bld" style="left:23%;width:12%;height:67%"></div><div class="bld" style="left:37%;width:10%;height:100%"></div><div class="bld" style="left:49%;width:15%;height:74%"></div><div class="bld" style="left:67%;width:9%;height:95%"></div><div class="bld" style="left:79%;width:19%;height:72%"></div></div>
  <div id="crowd"></div><div id="ring"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="post pl"></div><div class="post pr"></div>
  <div id="p" class="fighter"><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="headband"></div><div class="eye"></div><div class="neck"></div><div class="torso"></div><div class="chestStripe"></div><div class="arm a1"></div><div class="arm a2"></div><div class="glove g1"></div><div class="glove g2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe s1"></div><div class="shoe s2"></div></div>
  <div id="b" class="fighter bot"><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="beard"></div><div class="eye"></div><div class="neck"></div><div class="torso"></div><div class="chestStripe"></div><div class="arm a1"></div><div class="arm a2"></div><div class="glove g1"></div><div class="glove g2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe s1"></div><div class="shoe s2"></div></div>
  <div id="msg">FIGHT!</div>
  <div id="controls"><div class="pad"><button class="c" id="L">◀</button><button class="c" id="R">▶</button><button class="c" id="J">▲</button><button class="c" id="BL">BLOCK</button></div><div class="acts"><button class="c" id="P">PUNCH</button><button class="c" id="K">KICK</button><button class="c" id="S">SPECIAL</button><button class="c" id="D">DASH</button></div></div><div id="dbg">TOUCH READY</div>
</div>
<script>
(function(){
"use strict";
var pe=document.getElementById("p"),be=document.getElementById("b"),pf=document.getElementById("pf"),bf=document.getElementById("bf"),pef=document.getElementById("pe"),bef=document.getElementById("be"),tm=document.getElementById("timer"),msg=document.getElementById("msg"),dbg=document.getElementById("dbg"),game=document.getElementById("game");
var P={x:22,hp:100,en:0,cool:0,atk:"",block:false,jump:false,hit:false},B={x:66,hp:100,en:0,cool:0,atk:"",block:false,jump:false,hit:false},held={L:false,R:false},start=Date.now(),over=false,last=Date.now();
function crowd(){var c=document.getElementById("crowd");for(var i=0;i<34;i++){var d=document.createElement("div");d.className="person";d.style.left=(i*3.02)+"%";d.style.height=(27+(i%5)*3)+"px";c.appendChild(d)}}crowd();
function show(t){msg.textContent=t;msg.style.opacity="1";setTimeout(function(){msg.style.opacity="0"},700)}show("FIGHT!");
function render(){pe.style.left=P.x+"%";be.style.left=B.x+"%";pf.style.width=P.hp+"%";bf.style.width=B.hp+"%";pef.style.width=P.en+"%";bef.style.width=B.en+"%";pe.classList.toggle("blocking",P.block);be.classList.toggle("blocking",B.block);if(P.x>B.x){pe.classList.add("faceLeft");be.classList.remove("faceLeft")}else{pe.classList.remove("faceLeft");be.classList.add("faceLeft")}}
function dmg(a,d,el,n){var val=d.block?n*.25:n;d.hp=Math.max(0,d.hp-val);a.en=Math.min(100,a.en+(d.block?4:10));d.en=Math.min(100,d.en+4);d.hit=true;el.classList.add("hit");setTimeout(function(){d.hit=false;el.classList.remove("hit")},160);if(d.hp<=0&&!over){over=true;show(a===P?"YOU WIN!":"BOT WINS!");setTimeout(reset,1600)}}
function shot(fromP){var a=fromP?P:B,d=fromP?B:P,target=fromP?be:pe,s=document.createElement("div");s.className="shot"+(fromP?"":" botshot");s.style.left=a.x+"%";s.style.bottom="30%";game.appendChild(s);var x=a.x,dir=d.x>x?1:-1,iv=setInterval(function(){x+=dir*1.8;s.style.left=x+"%";if(Math.abs(x-d.x)<4){clearInterval(iv);s.remove();dmg(a,d,target,18)}else if(x<-5||x>105){clearInterval(iv);s.remove()}},18)}
function atk(a,d,el,type){if(over||a.cool>0||a.hit)return;if(type==="special"&&a.en<40)return;if(type==="special")a.en-=40;a.atk=type;a.cool=type==="punch"?.34:(type==="kick"?.48:.65);el.classList.add(type);setTimeout(function(){if(over)return;var dist=Math.abs(a.x-d.x),range=type==="punch"?13:(type==="kick"?17:99);if(type==="special")shot(a===P);else if(dist<range)dmg(a,d,d===P?pe:be,type==="punch"?8:12)},type==="punch"?120:(type==="kick"?170:180));setTimeout(function(){el.classList.remove(type)},420)}
function jump(){if(P.jump||over)return;P.jump=true;pe.classList.add("jump");setTimeout(function(){P.jump=false;pe.classList.remove("jump")},460)}
function dash(){if(over)return;P.x+=B.x>P.x?7:-7;P.x=Math.max(7,Math.min(86,P.x))}
function reset(){P.x=22;P.hp=100;P.en=0;P.cool=0;P.atk="";P.block=false;P.hit=false;P.jump=false;B.x=66;B.hp=100;B.en=0;B.cool=0;B.atk="";B.block=false;B.hit=false;start=Date.now();over=false;show("FIGHT!")}
function botAI(){if(over)return;var dist=Math.abs(P.x-B.x);B.block=false;if(dist>16){B.x+=P.x>B.x?1:-1}else{var r=Math.random();if(P.atk&&r<.25)B.block=true;else if(B.en>=40&&r<.10)atk(B,P,be,"special");else if(r<.48)atk(B,P,be,"punch");else if(r<.80)atk(B,P,be,"kick");else if(r<.88)B.block=true}}setInterval(botAI,170);
function loop(){var now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(P.cool>0){P.cool-=dt;if(P.cool<=0)P.atk=""}if(B.cool>0){B.cool-=dt;if(B.cool<=0)B.atk=""}if(!over&&!P.atk&&!P.block){if(held.L)P.x-=24*dt;if(held.R)P.x+=24*dt;P.x=Math.max(7,Math.min(86,P.x))}if(!over){var t=Math.max(0,99-Math.floor((now-start)/1000));tm.textContent=t;if(t===0){over=true;show(P.hp===B.hp?"DRAW!":(P.hp>B.hp?"YOU WIN!":"BOT WINS!"));setTimeout(reset,1600)}}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function hold(id,key){var e=document.getElementById(id);function on(ev){ev.preventDefault();held[key]=true;e.classList.add("on");dbg.textContent=id+" ON"}function off(ev){ev.preventDefault();held[key]=false;e.classList.remove("on")}e.addEventListener("pointerdown",on);e.addEventListener("pointerup",off);e.addEventListener("pointercancel",off);e.addEventListener("touchstart",on,{passive:false});e.addEventListener("touchend",off,{passive:false});e.addEventListener("touchcancel",off,{passive:false})}hold("L","L");hold("R","R");
(function(){var e=document.getElementById("BL");function on(ev){ev.preventDefault();P.block=true;e.classList.add("on")}function off(ev){ev.preventDefault();P.block=false;e.classList.remove("on")}e.addEventListener("pointerdown",on);e.addEventListener("pointerup",off);e.addEventListener("pointercancel",off);e.addEventListener("touchstart",on,{passive:false});e.addEventListener("touchend",off,{passive:false});e.addEventListener("touchcancel",off,{passive:false})})();
function tap(id,fn){var e=document.getElementById(id),lock=false;function fire(ev){ev.preventDefault();if(lock)return;lock=true;setTimeout(function(){lock=false},80);fn();dbg.textContent=id}e.addEventListener("pointerdown",fire);e.addEventListener("touchstart",fire,{passive:false})}tap("J",jump);tap("P",function(){atk(P,B,pe,"punch")});tap("K",function(){atk(P,B,pe,"kick")});tap("S",function(){atk(P,B,pe,"special")});tap("D",dash);
window.addEventListener("error",function(e){dbg.textContent="JS ERROR: "+(e.message||"unknown");dbg.style.color="#ff8c8c"});render();
})();
</script>
</body>
</html>
